name: Develop Build & Deploy

on:
  push:
    branches: ["develop"]

env:
  DOCKERHUB_IMAGE_NAME: lunatalk-server

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      # -----------------------------
      # 1. Checkout
      # -----------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------
      # 2. Setup JDK 21
      # -----------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # -----------------------------
      # 3. Start test containers
      # -----------------------------
      - name: Start test docker containers
        run: docker compose -f ./docker-compose-test.yaml up -d

      # -----------------------------
      # 4. Gradle build
      # -----------------------------
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build

      # -----------------------------
      # 5. Docker login
      # -----------------------------
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -----------------------------
      # 6. Docker metadata
      # -----------------------------
      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_IMAGE_NAME }}
          tags: |
            type=sha,prefix=

      # -----------------------------
      # 7. Docker build & push
      # -----------------------------
      - name: Docker Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}

      # -----------------------------
      # 8. Copy docker-compose.yaml
      # -----------------------------
      - name: Copy docker-compose.yaml to EC2
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: ./docker-compose.yaml
          remote_path: /home/ubuntu/app/
          remote_host: ${{ secrets.EC2_HOST }}
          remote_user: ${{ secrets.EC2_USERNAME }}
          remote_key: ${{ secrets.EC2_PRIVATE_KEY }}

      # -----------------------------
      # 9. Copy Prometheus config
      # -----------------------------
      - name: Copy prometheus config to EC2
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: ./prometheus
          remote_path: /home/ubuntu/app/
          remote_host: ${{ secrets.EC2_HOST }}
          remote_user: ${{ secrets.EC2_USERNAME }}
          remote_key: ${{ secrets.EC2_PRIVATE_KEY }}

      # -----------------------------
      # 10. Copy Grafana config
      # -----------------------------
      - name: Copy grafana config to EC2
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: ./grafana
          remote_path: /home/ubuntu/app/
          remote_host: ${{ secrets.EC2_HOST }}
          remote_user: ${{ secrets.EC2_USERNAME }}
          remote_key: ${{ secrets.EC2_PRIVATE_KEY }}

      # -----------------------------
      # 11. Deploy on EC2
      # -----------------------------
      - name: Deploy to EC2 Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_FULL_URL: ${{ steps.metadata.outputs.tags }}
          DOCKERHUB_IMAGE_NAME: ${{ env.DOCKERHUB_IMAGE_NAME }}
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          envs: IMAGE_FULL_URL, DOCKERHUB_IMAGE_NAME, GRAFANA_ADMIN_USER, GRAFANA_ADMIN_PASSWORD
          debug: true
          script: |
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            cd ~/app
            docker compose down
            docker compose pull
            docker compose up -d backend redis nginx prometheus grafana mysqld_exporter
            docker exec -d nginx nginx -s reload
            docker image prune -a -f
