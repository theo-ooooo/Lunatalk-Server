spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MYSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379
      password:

jwt:
  issuer: test
  access-token-secret: testtesttesttesttesttesttesttest
  access-token-expiration-time: 7200
  refresh-token-secret: testtesttesttesttesttesttesttest
  refresh-token-expiration-time: 604800

oauth:
  kakao:
    client-id: test
    client-secret: test
    redirect-uri: http://localhost:3000/auth/kakao/callback
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me

toss:
  secret-key: test
  client-key: test
  base-url: https://api.tosspayments.com

aws:
  profile: default
  bucket: test
  region: ap-northeast-2
  endpoint: https://s3.ap-northeast-2.amazonaws.com
