name: Production ECR → ECS Deploy

on:
  push:
    branches: ["main"]

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: lunatalk-api
  ECS_SERVICE: lunatalk-service
  ECS_CLUSTER: lunatalk-cluster
  ECS_TASK_DEFINITION: lunatalk-server-task
  CONTAINER_NAME: lunatalk-server

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: PROD

    steps:
      # -----------------------------
      # 1. Checkout
      # -----------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------
      # 2. Setup JDK 21
      # -----------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # -----------------------------
      # 3. Start test containers
      # -----------------------------
      - name: Start test docker containers
        run: docker compose -f ./docker-compose-test.yaml up -d

      # -----------------------------
      # 4. Gradle build
      # -----------------------------
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build

      # -----------------------------
      # 5. Configure AWS credentials
      # -----------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # -----------------------------
      # 6. Login to Amazon ECR
      # -----------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # -----------------------------
      # 7. Get ECR registry
      # -----------------------------
      - name: Get ECR registry
        id: ecr-registry
        run: |
          echo "registry=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_OUTPUT

      # -----------------------------
      # 8. Build, tag, and push image to Amazon ECR
      # -----------------------------
      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-registry.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # -----------------------------
      # 9. Update task definition with new image
      # -----------------------------
      - name: Update task definition with new image
        id: task-def
        run: |
          # Read ecs-task-definition.json (전체 Task Definition 구조)
          TASK_DEF=$(cat infrastructure/ecs-task-definition.json)

          # Update image only
          TASK_DEF=$(echo "$TASK_DEF" | jq --arg IMAGE "${{ steps.build-image.outputs.image }}" \
            '.containerDefinitions[0].image = $IMAGE')

          echo "$TASK_DEF" > task-definition-updated.json
          echo "task-def-json=task-definition-updated.json" >> $GITHUB_OUTPUT

      # -----------------------------
      # 11. Register new task definition
      # -----------------------------
      - name: Register Amazon ECS task definition
        id: task-definition
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://${{ steps.task-def.outputs.task-def-json }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task-definition-arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT

      # -----------------------------
      # 12. Deploy Amazon ECS task definition to service
      # -----------------------------
      - name: Deploy Amazon ECS task definition to service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition ${{ steps.task-definition.outputs.task-definition-arn }} \
            --force-new-deployment

      # -----------------------------
      # 13. Wait for service to stabilize
      # -----------------------------
      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}
