spring:
  config:
    activate:
      on-profile: "actuator"

management:
  endpoints:
    web:
      base-path: /lunatalk-actuator
      exposure:
        include: health, info
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false
